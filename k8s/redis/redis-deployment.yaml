apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai
  labels:
    app: redis
    tier: cache
    env: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: cache
        env: local
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          # Start redis with save disabled — we don't need
          # persistence for a state cache. If PEAG restarts,
          # it rebuilds state from Kubernetes anyway.
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
      # Redis is tiny — run it on a CPU node
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - cpu
