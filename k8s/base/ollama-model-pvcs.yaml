apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-fast
  namespace: ai
  labels:
    app: peag
    tier: storage
    model: fast
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-smart
  namespace: ai
  labels:
    app: peag
    tier: storage
    model: smart
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
