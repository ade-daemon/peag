apiVersion: peag.io/v1alpha1
kind: ModelConfig
metadata:
  name: fast
  namespace: ai
  labels:
    app: peag
    env: local
spec:
  modelName: tinyllama
  backend: ollama
  hardware: cpu
  coldStartBehaviour: queue
  idleTTLSeconds: 600
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  maxConcurrentRequests: 10
  maxReplicas: 3
