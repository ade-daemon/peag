apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai
  labels:
    app: open-webui
    tier: frontend
    env: local
spec:
  selector:
    app: open-webui
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30000
      name: http
  type: NodePort
