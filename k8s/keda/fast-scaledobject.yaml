apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: peag-fast
  namespace: ai
spec:
  scaleTargetRef:
    name: peag-fast
    kind: Deployment
    apiVersion: apps/v1
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: redis
      metadata:
        address: redis.ai.svc.cluster.local:6379
        keyName: model:pending:fast
        keyLength: "1"
        activationKeyLength: "1"
        databaseIndex: "0"
        enableTLS: "false"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: peag-smart
  namespace: ai
spec:
  scaleTargetRef:
    name: peag-smart
    kind: Deployment
    apiVersion: apps/v1
  minReplicaCount: 0
  maxReplicaCount: 2
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: redis
      metadata:
        address: redis.ai.svc.cluster.local:6379
        keyName: model:pending:smart
        keyLength: "1"
        activationKeyLength: "1"
        databaseIndex: "0"
        enableTLS: "false"